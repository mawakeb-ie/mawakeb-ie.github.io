<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4C1D95">
<title>متابعة أعمال المعلّمين · التربية الإسلامية</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%98%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #F6F2FF; overflow: hidden; font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #wait { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(135deg, #4C1D95, #7C3AED 55%, #DB2777); color: #fff; z-index: 2; transition: opacity .4s; }
  #wait.hide { opacity: 0; pointer-events: none; }
  .box { text-align: center; padding: 24px; max-width: 460px; }
  .spin { width: 46px; height: 46px; border-radius: 50%; border: 5px solid rgba(255,255,255,.3); border-top-color: #FFB347; margin: 0 auto 16px; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { opacity: .9; line-height: 1.7; margin: 6px 0; }
  #help { display: none; margin-top: 18px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); border-radius: 18px; padding: 16px; }
  a.go { display: inline-block; margin-top: 10px; background: #FFB347; color: #3B1A00; font-weight: 800; font-size: 18px; text-decoration: none; padding: 12px 26px; border-radius: 999px; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
  small { display: block; margin-top: 10px; opacity: .8; font-size: 13px; }
</style>
</head>
<body>
<div id="wait"><div class="box">
  <div class="spin"></div>
  <h1>متابعة أعمال معلّمي التربية الإسلامية</h1>
  <p>جارٍ فتح المنصّة...</p>
  <p id="slow" style="display:none">لحظة، نفتح المنصّة بطريقة أخرى...</p>
</div></div>
<iframe id="app" title="متابعة أعمال المعلّمين" allow="clipboard-write; autoplay"></iframe>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbywLYjS4v5d7q1cAiw2LA8_FpuvIm2qavTDCIUiMO9ZboyuFXWhNVikep0_NlCEnhI/exec';
  var ok = false, w = document.getElementById('wait');
  window.addEventListener('message', function (e) { if (e.data && e.data.fu === 'ready') { ok = true; w.classList.add('hide'); } });
  document.getElementById('app').src = APP;
  /* the platform says "ready" within a few seconds. Some school networks and browsers refuse to show it inside this page:
     then it opens by itself directly, with nothing for the user to do */
  setTimeout(function () { if (!ok) { document.getElementById('slow').style.display = 'block'; setTimeout(function () { if (!ok) location.replace(APP); }, 1200); } }, 12000);
</script>
</body>
</html>
